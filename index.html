  <script type="text/babel">

    // 1. SkillsCanvas Component — Interactive Faint Background Grid Nodes
    const SkillsCanvas = () => {
      const canvasRef = React.useRef(null);

      React.useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');

        let animationFrameId;
        let width = (canvas.width = canvas.parentElement.offsetWidth);
        let height = (canvas.height = canvas.parentElement.offsetHeight);

        const handleResize = () => {
          if (!canvas || !canvas.parentElement) return;
          width = canvas.width = canvas.parentElement.offsetWidth;
          height = canvas.height = canvas.parentElement.offsetHeight;
        };

        window.addEventListener('resize', handleResize);

        const mouse = { x: null, y: null, radius: 150 };

        const handleMouseMove = (e) => {
          const rect = canvas.getBoundingClientRect();
          mouse.x = e.clientX - rect.left;
          mouse.y = e.clientY - rect.top;
        };

        const handleMouseLeave = () => {
          mouse.x = null;
          mouse.y = null;
        };

        canvas.parentElement.addEventListener('mousemove', handleMouseMove);
        canvas.parentElement.addEventListener('mouseleave', handleMouseLeave);

        const numPoints = Math.min(Math.floor((width * height) / 9500), 50);
        const points = [];

        for (let i = 0; i < numPoints; i++) {
          points.push({
            x: Math.random() * width,
            y: Math.random() * height,
            vx: (Math.random() - 0.5) * 0.6,
            vy: (Math.random() - 0.5) * 0.6,
            radius: Math.random() * 1.8 + 1,
          });
        }

        const draw = () => {
          ctx.clearRect(0, 0, width, height);

          for (let i = 0; i < points.length; i++) {
            const p1 = points[i];
            p1.x += p1.vx;
            p1.y += p1.vy;

            if (p1.x < 0 || p1.x > width) p1.vx *= -1;
            if (p1.y < 0 || p1.y > height) p1.vy *= -1;

            if (mouse.x !== null && mouse.y !== null) {
              const dx = mouse.x - p1.x;
              const dy = mouse.y - p1.y;
              const dist = Math.sqrt(dx * dx + dy * dy);
              if (dist < mouse.radius) {
                const angle = Math.atan2(dy, dx);
                const force = (mouse.radius - dist) / mouse.radius;
                p1.x -= Math.cos(angle) * force * 1.8;
                p1.y -= Math.sin(angle) * force * 1.8;
              }
            }

            ctx.beginPath();
            ctx.arc(p1.x, p1.y, p1.radius, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(196, 181, 253, 0.35)';
            ctx.fill();

            for (let j = i + 1; j < points.length; j++) {
              const p2 = points[j];
              const dx = p1.x - p2.x;
              const dy = p1.y - p2.y;
              const dist = Math.sqrt(dx * dx + dy * dy);

              if (dist < 125) {
                ctx.beginPath();
                ctx.moveTo(p1.x, p1.y);
                ctx.lineTo(p2.x, p2.y);
                const alpha = (1 - dist / 125) * 0.15;
                ctx.strokeStyle = `rgba(167, 139, 250, ${alpha})`;
                ctx.lineWidth = 0.8;
                ctx.stroke();
              }
            }
          }

          animationFrameId = requestAnimationFrame(draw);
        };

        draw();

        return () => {
          cancelAnimationFrame(animationFrameId);
          window.removeEventListener('resize', handleResize);
          if (canvas && canvas.parentElement) {
            canvas.parentElement.removeEventListener('mousemove', handleMouseMove);
            canvas.parentElement.removeEventListener('mouseleave', handleMouseLeave);
          }
        };
      }, []);

      return <canvas ref={canvasRef} className="absolute inset-0 pointer-events-none opacity-50 z-0" />;
    };

    // 2. CustomCursor Component
    const CustomCursor = () => {
      const dotRef = React.useRef(null);
      const ringRef = React.useRef(null);

      React.useEffect(() => {
        const dot = dotRef.current;
        const ring = ringRef.current;
        if (!dot || !ring) return;

        let mouseX = -100;
        let mouseY = -100;
        let ringX = -100;
        let ringY = -100;

        const onMouseMove = (e) => {
          mouseX = e.clientX;
          mouseY = e.clientY;
          dot.style.transform = `translate3d(${mouseX}px, ${mouseY}px, 0) translate(-50%, -50%)`;

          const target = e.target;
          const isClickable = target.closest('a, button, input, textarea, select, .clickable, .project-card, .skill-card');
          if (isClickable) {
            document.body.classList.add('hovering-clickable');
          } else {
            document.body.classList.remove('hovering-clickable');
          }
        };

        let animationFrame;
        const render = () => {
          ringX += (mouseX - ringX) * 0.18;
          ringY += (mouseY - ringY) * 0.18;
          ring.style.transform = `translate3d(${ringX}px, ${ringY}px, 0) translate(-50%, -50%)`;
          animationFrame = requestAnimationFrame(render);
        };

        window.addEventListener('mousemove', onMouseMove);
        animationFrame = requestAnimationFrame(render);

        return () => {
          window.removeEventListener('mousemove', onMouseMove);
          cancelAnimationFrame(animationFrame);
        };
      }, []);

      return (
        <React.Fragment>
          <div ref={dotRef} className="custom-cursor-dot hidden md:block" />
          <div ref={ringRef} className="custom-cursor-ring hidden md:block" />
        </React.Fragment>
      );
    };

      React.useEffect(() => {
        const sections = document.querySelectorAll('section[id]');
        const observer = new IntersectionObserver(
          (entries) => {
            entries.forEach((entry) => {
              if (entry.isIntersecting) {
                setActiveSection(entry.target.id);
              }
            });
          },
          { threshold: 0.3 }
        );

        sections.forEach((section) => observer.observe(section));
        return () => observer.disconnect();
      }, []);
